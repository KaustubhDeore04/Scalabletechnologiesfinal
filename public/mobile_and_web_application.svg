<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="50%" stop-color="#11192e"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3ee6c8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0f1c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-orange" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ff7c4d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0f1c" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ee6c8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#ff7c4d"/>
    </linearGradient>

    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182440" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1424" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow-cyan)"/>
  <rect width="1280" height="720" fill="url(#glow-orange)"/>

  <!-- Background Tech Grid -->
  <g stroke="rgba(236,238,243,0.03)" stroke-width="1">
    <path d="M 0,90 L 1280,90 M 0,180 L 1280,180 M 0,270 L 1280,270 M 0,360 L 1280,360 M 0,450 L 1280,450 M 0,540 L 1280,540 M 0,630 L 1280,630" />
    <path d="M 160,0 L 160,720 M 320,0 L 320,720 M 480,0 L 480,720 M 640,0 L 640,720 M 800,0 L 800,720 M 960,0 L 960,720 M 1120,0 L 1120,720" />
  </g>

  <!-- LEFT COLUMN: THUMBNAIL TEXT & BRANDING -->
  <!-- Tag / Badge -->
  <g transform="translate(90, 140)">
    <rect width="160" height="36" rx="18" fill="rgba(62,230,200,0.12)" stroke="#3ee6c8" stroke-width="1"/>
    <text x="80" y="23" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#3ee6c8" text-anchor="middle" letter-spacing="1.5">DEVELOPMENT</text>
  </g>

  <!-- Main Headline -->
  <text x="90" y="240" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">WEB &amp; MOBILE</text>
  <text x="90" y="320" font-family="'Inter', system-ui, sans-serif" font-size="64" font-weight="900" fill="url(#text-grad)" letter-spacing="-1">APPLICATIONS</text>

  <!-- Subtitle -->
  <text x="90" y="380" font-family="'Inter', system-ui, sans-serif" font-size="20" fill="#93a0bd" font-weight="400">High-performance cross-platform apps &amp; cloud portals.</text>

  <!-- Key Feature Pills -->
  <g transform="translate(90, 440)">
    <!-- Pill 1 -->
    <rect width="130" height="38" rx="8" fill="#131c33" stroke="rgba(236,238,243,0.1)" stroke-width="1"/>
    <text x="65" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#eceef3" text-anchor="middle">⚛️ React Native</text>

    <!-- Pill 2 -->
    <rect x="142" width="110" height="38" rx="8" fill="#131c33" stroke="rgba(236,238,243,0.1)" stroke-width="1"/>
    <text x="197" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#eceef3" text-anchor="middle">⚡ Next.js</text>

    <!-- Pill 3 -->
    <rect x="264" width="120" height="38" rx="8" fill="#131c33" stroke="rgba(236,238,243,0.1)" stroke-width="1"/>
    <text x="324" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#eceef3" text-anchor="middle">☁️ Cloud API</text>
  </g>

  <!-- RIGHT COLUMN: 3D HERO GRAPHICS -->
  <!-- Web Browser Mockup Frame -->
  <g transform="translate(620, 150)" filter="url(#shadow)">
    <rect width="530" height="340" rx="16" fill="url(#glass-card)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    
    <!-- Topbar -->
    <path d="M 0,16 Q 0,0 16,0 L 514,0 Q 530,0 530,16 L 530,40 L 0,40 Z" fill="#090e1a"/>
    <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="20" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="20" r="5" fill="#27c93f"/>
    <rect x="80" y="10" width="220" height="20" rx="5" fill="rgba(255,255,255,0.06)"/>

    <!-- Content Mockup inside Web Frame -->
    <rect x="30" y="70" width="220" height="110" rx="10" fill="#111a2e" stroke="rgba(62,230,200,0.2)"/>
    <text x="50" y="105" font-family="'Inter', sans-serif" font-size="12" fill="#93a0bd">Active Users</text>
    <text x="50" y="140" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff">128.4k</text>

    <rect x="270" y="70" width="230" height="110" rx="10" fill="#111a2e" stroke="rgba(255,124,77,0.2)"/>
    <text x="290" y="105" font-family="'Inter', sans-serif" font-size="12" fill="#93a0bd">Latency</text>
    <text x="290" y="140" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#3ee6c8">14 ms</text>

    <!-- Chart Line -->
    <path d="M 30,290 Q 150,220 270,250 T 500,200" fill="none" stroke="url(#text-grad)" stroke-width="4"/>
  </g>

  <!-- Mobile Phone Mockup Overlay -->
  <g transform="translate(980, 240)" filter="url(#shadow)">
    <rect width="210" height="400" rx="32" fill="#090e1a" stroke="rgba(62,230,200,0.4)" stroke-width="3"/>
    <rect x="75" y="14" width="60" height="14" rx="7" fill="#000000"/>
    
    <!-- App UI Inside Mobile -->
    <rect x="18" y="50" width="174" height="80" rx="12" fill="#182440"/>
    <text x="32" y="80" font-family="'Inter', sans-serif" font-size="11" fill="#93a0bd">Revenue</text>
    <text x="32" y="108" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#3ee6c8">$48,250</text>

    <rect x="18" y="145" width="174" height="44" rx="8" fill="rgba(255,255,255,0.04)"/>
    <rect x="18" y="200" width="174" height="44" rx="8" fill="rgba(255,255,255,0.04)"/>
    <rect x="18" y="255" width="174" height="44" rx="8" fill="rgba(255,255,255,0.04)"/>

    <!-- Bottom Nav -->
    <rect x="18" y="340" width="174" height="36" rx="18" fill="#131c33"/>
    <circle cx="50" cy="358" r="5" fill="#3ee6c8"/>
    <circle cx="105" cy="358" r="5" fill="#93a0bd" opacity="0.4"/>
    <circle cx="160" cy="358" r="5" fill="#93a0bd" opacity="0.4"/>
  </g>
</svg>
