<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background: #05070a; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Cinematic Radial Glows -->
    <radialGradient id="teal-glow" cx="25%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple-glow" cx="75%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber-glow" cx="60%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="0"/>
    </radialGradient>

    <!-- Text & Accent Gradients -->
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1423" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#070911" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="track-video" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="heavy-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <filter id="neon-teal" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="neon-red" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. CANVAS BASE & ATMOSPHERIC LIGHTING -->
  <rect width="1280" height="720" fill="#05070a"/>
  <rect width="1280" height="720" fill="url(#teal-glow)"/>
  <rect width="1280" height="720" fill="url(#purple-glow)"/>
  <rect width="1280" height="720" fill="url(#amber-glow)"/>

  <!-- Subtle Director's Grid & Focus Marks -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <path d="M 0,90 L 1280,90 M 0,180 L 1280,180 M 0,270 L 1280,270 M 0,360 L 1280,360 M 0,450 L 1280,450 M 0,540 L 1280,540 M 0,630 L 1280,630" />
    <path d="M 160,0 L 160,720 M 320,0 L 320,720 M 480,0 L 480,720 M 640,0 L 640,720 M 800,0 L 800,720 M 960,0 L 960,720 M 1120,0 L 1120,720" />
    
    <!-- Camera Frame Marks -->
    <path d="M 60,60 L 100,60 M 60,60 L 60,100" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>
    <path d="M 1220,60 L 1180,60 M 1220,60 L 1220,100" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>
    <path d="M 60,660 L 100,660 M 60,660 L 60,620" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>
    <path d="M 1220,660 L 1180,660 M 1220,660 L 1220,620" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>
  </g>

  <!-- 2. LEFT SIDE: THUMBNAIL TEXT & BRANDING -->
  <!-- Category Pill Badge -->
  <g transform="translate(80, 105)">
    <rect width="210" height="38" rx="19" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1.5" filter="url(#neon-teal)"/>
    <text x="105" y="24" font-size="12" font-weight="800" fill="#06b6d4" text-anchor="middle" letter-spacing="2">🎬 CREATIVE STUDIO</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 220)" filter="url(#heavy-shadow)">
    <text x="0" y="0" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-2">VIDEO &amp; PHOTO</text>
    <text x="0" y="78" font-size="64" font-weight="900" fill="url(#title-gradient)" letter-spacing="-1.5">PRODUCTION</text>
  </g>

  <!-- Subheadline -->
  <text x="80" y="345" font-size="20" fill="#94a3b8" font-weight="400">
    Cinematic storytelling, high-end photography, 
  </text>
  <text x="80" y="373" font-size="20" fill="#94a3b8" font-weight="400">
    and cutting-edge post-production workflows.
  </text>

  <!-- Feature Tags Row -->
  <g transform="translate(80, 428)">
    <!-- Tag 1 -->
    <rect width="145" height="42" rx="10" fill="#0b0f19" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
    <text x="72" y="26" font-size="13" font-weight="700" fill="#06b6d4" text-anchor="middle">🎥 4K/8K Video</text>

    <!-- Tag 2 -->
    <rect x="157" width="145" height="42" rx="10" fill="#0b0f19" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
    <text x="229" y="26" font-size="13" font-weight="700" fill="#a855f7" text-anchor="middle">📸 Studio Photo</text>

    <!-- Tag 3 -->
    <rect x="314" width="130" height="42" rx="10" fill="#0b0f19" stroke="rgba(244,63,94,0.3)" stroke-width="1"/>
    <text x="379" y="26" font-size="13" font-weight="700" fill="#f43f5e" text-anchor="middle">✂️ Post-Editing</text>
  </g>

  <!-- Performance / Spec Strip -->
  <g transform="translate(80, 520)">
    <rect width="450" height="72" rx="14" fill="rgba(11, 15, 25, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <text x="24" y="28" font-size="11" fill="#64748b" font-weight="600">RESOLUTION</text>
    <text x="24" y="52" font-size="20" fill="#ffffff" font-weight="800">8K RAW</text>

    <line x1="160" y1="16" x2="160" y2="56" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <text x="184" y="28" font-size="11" fill="#64748b" font-weight="600">FRAME RATE</text>
    <text x="184" y="52" font-size="20" fill="#06b6d4" font-weight="800">120 FPS</text>

    <line x1="305" y1="16" x2="305" y2="56" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <text x="329" y="28" font-size="11" fill="#64748b" font-weight="600">COLOR DEPTH</text>
    <text x="329" y="52" font-size="20" fill="#a855f7" font-weight="800">10-Bit HDR</text>
  </g>

  <!-- 3. RIGHT SIDE: VISUAL GRAPHIC (STUDIO / NLE WORKSPACE) -->
  <g transform="translate(580, 85)" filter="url(#heavy-shadow)">
    <!-- Main Window Outer Frame -->
    <rect width="620" height="530" rx="20" fill="url(#card-grad)" stroke="url(#glass-border)" stroke-width="2"/>
    
    <!-- Title Bar -->
    <path d="M 0,20 Q 0,0 20,0 L 600,0 Q 620,0 620,20 L 620,48 L 0,48 Z" fill="#06080e"/>
    <circle cx="28" cy="24" r="5.5" fill="#ff5f56"/>
    <circle cx="46" cy="24" r="5.5" fill="#ffbd2e"/>
    <circle cx="64" cy="24" r="5.5" fill="#27c93f"/>
    <rect x="100" y="14" width="280" height="20" rx="6" fill="rgba(255,255,255,0.05)"/>
    <text x="115" y="28" font-size="10" fill="#64748b">https://studio.render/workspace_v2</text>

    <!-- Canvas Inner Layout -->
    <g transform="translate(0, 48)">
      
      <!-- Video Player / Viewer Area -->
      <g transform="translate(30, 20)">
        <!-- Video Frame -->
        <rect width="560" height="260" rx="12" fill="#030407" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        
        <!-- Cinematic Aspect Ratio Bars -->
        <rect x="0" y="0" width="560" height="30" rx="12" fill="#000000"/>
        <rect x="0" y="230" width="560" height="30" rx="12" fill="#000000"/>
        
        <!-- Frame Grids -->
        <line x1="186" y1="30" x2="186" y2="230" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="373" y1="30" x2="373" y2="230" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4,4"/>
        <line x1="0" y1="130" x2="560" y2="130" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="4,4"/>

        <!-- Glowing Center Play Button -->
        <g transform="translate(240, 90)">
          <circle cx="40" cy="40" r="40" fill="rgba(6,182,212,0.15)" filter="url(#neon-teal)"/>
          <circle cx="40" cy="40" r="40" fill="none" stroke="#06b6d4" stroke-width="2"/>
          <polygon points="32,25 56,40 32,55" fill="#ffffff"/>
        </g>

        <!-- Timecode overlay -->
        <rect x="440" y="195" width="105" height="24" rx="4" fill="rgba(0,0,0,0.6)"/>
        <text x="492" y="211" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#06b6d4" text-anchor="middle">01:04:12:08</text>
      </g>

      <!-- Non-Linear Editing (NLE) Timeline Area -->
      <g transform="translate(30, 310)">
        <text x="0" y="0" font-size="11" font-weight="700" fill="#94a3b8">MAIN SEQUENCE (4K)</text>
        
        <!-- Timeline Background & Ruler -->
        <rect x="0" y="15" width="560" height="140" rx="8" fill="#080a12" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <path d="M 10,25 L 550,25" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <!-- Ticks -->
        <path d="M 50,20 L 50,25 M 150,20 L 150,25 M 250,20 L 250,25 M 350,20 L 350,25 M 450,20 L 450,25" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

        <!-- V2 (B-Roll) Track -->
        <rect x="160" y="40" width="90" height="22" rx="4" fill="#a855f7" opacity="0.8"/>
        <rect x="310" y="40" width="140" height="22" rx="4" fill="#a855f7" opacity="0.8"/>
        <text x="165" y="55" font-size="9" font-weight="600" fill="#ffffff">A_CAM_01.RAW</text>
        
        <!-- V1 (Main Video) Track -->
        <rect x="20" y="70" width="160" height="22" rx="4" fill="url(#track-video)"/>
        <rect x="185" y="70" width="220" height="22" rx="4" fill="url(#track-video)"/>
        <rect x="410" y="70" width="120" height="22" rx="4" fill="url(#track-video)"/>
        <text x="25" y="85" font-size="9" font-weight="600" fill="#ffffff">SCENE_04_TK1.MP4</text>

        <!-- A1 (Audio) Track -->
        <rect x="20" y="100" width="160" height="18" rx="4" fill="#10b981" opacity="0.5"/>
        <rect x="185" y="100" width="220" height="18" rx="4" fill="#10b981" opacity="0.5"/>
        <rect x="410" y="100" width="120" height="18" rx="4" fill="#10b981" opacity="0.5"/>
        <!-- Fake Waveform -->
        <path d="M 25,109 L 175,109 M 190,109 L 400,109 M 415,109 L 525,109" stroke="#ffffff" stroke-width="2" stroke-dasharray="2,3" opacity="0.4"/>

        <!-- A2 (SFX/Music) Track -->
        <rect x="20" y="125" width="510" height="18" rx="4" fill="#f59e0b" opacity="0.4"/>
        <path d="M 25,134 L 525,134" stroke="#ffffff" stroke-width="2" stroke-dasharray="1,4" opacity="0.4"/>

        <!-- Playhead (Red Line) -->
        <polygon points="245,15 255,15 250,25" fill="#f43f5e" filter="url(#neon-red)"/>
        <line x1="250" y1="25" x2="250" y2="155" stroke="#f43f5e" stroke-width="2" filter="url(#neon-red)"/>
      </g>
    </g>
  </g>

  <!-- 4. FLOATING 3D GLASS ACCENT BADGES -->
  <!-- Floating Recording Badge Top Right -->
  <g transform="translate(1010, 45)" filter="url(#heavy-shadow)">
    <rect width="180" height="46" rx="23" fill="#0b0f19" stroke="rgba(244,63,94,0.5)" stroke-width="1.5"/>
    <circle cx="28" cy="23" r="6" fill="#f43f5e" filter="url(#neon-red)"/>
    <text x="44" y="27" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">REC 00:14:23</text>
  </g>

  <!-- Floating Render Badge Bottom Right -->
  <g transform="translate(610, 590)" filter="url(#heavy-shadow)">
    <rect width="240" height="46" rx="12" fill="#0b0f19" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="16" y="28" font-size="11" font-family="'Courier New', monospace" fill="#06b6d4">final_cut_v4.mp4</text>
    <text x="155" y="28" font-size="10" font-weight="800" fill="#10b981">✓ RENDERED</text>
  </g>
</svg>
