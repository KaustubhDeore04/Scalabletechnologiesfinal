<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background: #070a14; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Background Radial Neon Glows -->
    <radialGradient id="purple-glow" cx="70%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#070a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070a14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orange-glow" cx="85%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#ff7c4d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#070a14" stop-opacity="0"/>
    </radialGradient>

    <!-- Text & Accent Fills -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff7c4d"/>
    </linearGradient>

    <linearGradient id="glass-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c30" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a101d" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Wire Gradients -->
    <linearGradient id="pipeline-wire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff7c4d"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="heavy-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="neon-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="neon-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. CANVAS BASE & ATMOSPHERIC LIGHTING -->
  <rect width="1280" height="720" fill="#070a14"/>
  <rect width="1280" height="720" fill="url(#purple-glow)"/>
  <rect width="1280" height="720" fill="url(#cyan-glow)"/>
  <rect width="1280" height="720" fill="url(#orange-glow)"/>

  <!-- High-Tech Background Grid Overlay -->
  <g stroke="rgba(236, 238, 243, 0.035)" stroke-width="1">
    <path d="M 0,90 L 1280,90 M 0,180 L 1280,180 M 0,270 L 1280,270 M 0,360 L 1280,360 M 0,450 L 1280,450 M 0,540 L 1280,540 M 0,630 L 1280,630" />
    <path d="M 160,0 L 160,720 M 320,0 L 320,720 M 480,0 L 480,720 M 640,0 L 640,720 M 800,0 L 800,720 M 960,0 L 960,720 M 1120,0 L 1120,720" />
  </g>

  <!-- 2. LEFT SIDE: THUMBNAIL TEXT & BRANDING -->
  <!-- Category Pill Badge -->
  <g transform="translate(80, 110)">
    <rect width="210" height="38" rx="19" fill="rgba(168,85,247,0.18)" stroke="#a855f7" stroke-width="1.5" filter="url(#neon-purple)"/>
    <text x="105" y="24" font-size="12" font-weight="800" fill="#a855f7" text-anchor="middle" letter-spacing="2">⚡ AUTONOMOUS AGENTS</text>
  </g>

  <!-- Bold Main Headline -->
  <g transform="translate(80, 220)" filter="url(#heavy-shadow)">
    <text x="0" y="0" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">AI &amp; WORKFLOW</text>
    <text x="0" y="75" font-size="64" font-weight="900" fill="url(#text-gradient)" letter-spacing="-1.5">AUTOMATION</text>
  </g>

  <!-- Subheadline -->
  <text x="80" y="340" font-size="20" fill="#94a3b8" font-weight="400" width="500">
    Connect LLM agents, webhooks, and enterprise apps
  </text>
  <text x="80" y="368" font-size="20" fill="#94a3b8" font-weight="400">
    into 24/7 self-executing intelligent pipelines.
  </text>

  <!-- Feature Tags Row -->
  <g transform="translate(80, 425)">
    <!-- Tag 1 -->
    <rect width="145" height="42" rx="10" fill="#111827" stroke="rgba(0,242,254,0.3)" stroke-width="1"/>
    <text x="72" y="26" font-size="13" font-weight="700" fill="#00f2fe" text-anchor="middle">🤖 GPT-4o Agent</text>

    <!-- Tag 2 -->
    <rect x="157" width="140" height="42" rx="10" fill="#111827" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
    <text x="227" y="26" font-size="13" font-weight="700" fill="#a855f7" text-anchor="middle">🔗 100+ Integrations</text>

    <!-- Tag 3 -->
    <rect x="309" width="130" height="42" rx="10" fill="#111827" stroke="rgba(255,124,77,0.3)" stroke-width="1"/>
    <text x="374" y="26" font-size="13" font-weight="700" fill="#ff7c4d" text-anchor="middle">🚀 Zero-Latency</text>
  </g>

  <!-- Bottom Metric Strip -->
  <g transform="translate(80, 520)">
    <rect width="440" height="70" rx="14" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <text x="24" y="28" font-size="11" fill="#64748b" font-weight="600">TIME SAVED</text>
    <text x="24" y="52" font-size="20" fill="#ffffff" font-weight="800">85% Faster</text>

    <line x1="160" y1="16" x2="160" y2="54" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <text x="184" y="28" font-size="11" fill="#64748b" font-weight="600">RELIABILITY</text>
    <text x="184" y="52" font-size="20" fill="#00f2fe" font-weight="800">99.9% Uptime</text>

    <line x1="300" y1="16" x2="300" y2="54" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <text x="324" y="28" font-size="11" fill="#64748b" font-weight="600">SCALE</text>
    <text x="324" y="52" font-size="20" fill="#a855f7" font-weight="800">10M+ Tasks</text>
  </g>

  <!-- 3. RIGHT SIDE: VISUAL GRAPHIC (WORKFLOW CANVAS & NODES) -->
  <g transform="translate(580, 90)" filter="url(#heavy-shadow)">
    <!-- Main Studio Card -->
    <rect width="620" height="520" rx="20" fill="url(#glass-card)" stroke="url(#glass-border)" stroke-width="2"/>
    
    <!-- Title Bar -->
    <path d="M 0,20 Q 0,0 20,0 L 600,0 Q 620,0 620,20 L 620,48 L 0,48 Z" fill="#0b101d"/>
    <circle cx="28" cy="24" r="5.5" fill="#ff5f56"/>
    <circle cx="46" cy="24" r="5.5" fill="#ffbd2e"/>
    <circle cx="64" cy="24" r="5.5" fill="#27c93f"/>
    <rect x="100" y="14" width="280" height="20" rx="6" fill="rgba(255,255,255,0.05)"/>
    <text x="115" y="28" font-size="10" fill="#64748b">https://agent.ai/studio/pipeline_v4</text>
    <rect x="490" y="14" width="110" height="20" rx="10" fill="rgba(0,242,254,0.15)"/>
    <text x="545" y="28" font-size="10" font-weight="700" fill="#00f2fe" text-anchor="middle">● Active Pipeline</text>

    <!-- Canvas Inner Grid -->
    <g transform="translate(0, 48)">
      <!-- Animated Conduit Paths -->
      <path d="M 130,220 C 200,220 200,160 270,160" fill="none" stroke="url(#pipeline-wire)" stroke-width="3.5"/>
      <path d="M 130,220 C 200,220 200,290 270,290" fill="none" stroke="url(#pipeline-wire)" stroke-width="3.5"/>

      <path d="M 430,160 C 470,160 470,100 510,100" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6,6"/>
      <path d="M 430,160 C 470,160 470,200 510,200" fill="none" stroke="#00f2fe" stroke-width="2.5"/>
      <path d="M 430,290 C 470,290 470,350 510,350" fill="none" stroke="#ff7c4d" stroke-width="2.5"/>

      <!-- Glowing Data Pulse Circles -->
      <circle cx="200" cy="190" r="5" fill="#00f2fe" filter="url(#neon-cyan)"/>
      <circle cx="470" cy="130" r="5" fill="#a855f7" filter="url(#neon-purple)"/>
      <circle cx="470" cy="320" r="5" fill="#ff7c4d"/>

      <!-- NODE 1: INPUT TRIGGER -->
      <g transform="translate(30, 170)">
        <rect width="100" height="100" rx="14" fill="#0f172a" stroke="#00f2fe" stroke-width="2" filter="url(#neon-cyan)"/>
        <text x="50" y="42" font-size="24" text-anchor="middle">⚡</text>
        <text x="50" y="68" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Webhook</text>
        <text x="50" y="82" font-size="9" fill="#00f2fe" text-anchor="middle">Trigger Event</text>
      </g>

      <!-- NODE 2A: MAIN AI BRAIN NODE (TOP PIPELINE) -->
      <g transform="translate(270, 100)">
        <rect width="160" height="120" rx="16" fill="#15102a" stroke="#a855f7" stroke-width="2.5" filter="url(#neon-purple)"/>
        <rect x="12" y="12" width="28" height="28" rx="8" fill="rgba(168,85,247,0.2)"/>
        <text x="26" y="31" font-size="14" text-anchor="middle">🧠</text>
        <text x="48" y="24" font-size="12" font-weight="800" fill="#ffffff">LLM Reasoning</text>
        <text x="48" y="36" font-size="9" fill="#a855f7">GPT-4o Auto-Parse</text>

        <rect x="12" y="52" width="136" height="24" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="20" y="68" font-size="9" fill="#e2e8f0">Intent Extraction</text>
        <text x="138" y="68" font-size="9" font-weight="700" fill="#00f2fe" text-anchor="end">99.8%</text>

        <rect x="12" y="82" width="136" height="24" rx="6" fill="rgba(255,255,255,0.04)"/>
        <text x="20" y="98" font-size="9" fill="#e2e8f0">Sentiment Score</text>
        <text x="138" y="98" font-size="9" font-weight="700" fill="#ff7c4d" text-anchor="end">High</text>
      </g>

      <!-- NODE 2B: CONDITIONAL ROUTER (BOTTOM PIPELINE) -->
      <g transform="translate(270, 250)">
        <rect width="160" height="80" rx="14" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>
        <text x="20" y="32" font-size="18">🔀</text>
        <text x="46" y="28" font-size="12" font-weight="700" fill="#ffffff">Branch Router</text>
        <text x="46" y="40" font-size="9" fill="#64748b">If Priority &gt; 80</text>
        <rect x="12" y="50" width="136" height="18" rx="4" fill="rgba(0,242,254,0.1)"/>
        <text x="80" y="63" font-size="9" font-weight="700" fill="#00f2fe" text-anchor="middle">➔ Fast Track Exec</text>
      </g>

      <!-- OUTPUT ACTION NODES -->
      <!-- Action 1: CRM -->
      <g transform="translate(510, 75)">
        <rect width="90" height="50" rx="10" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <text x="16" y="30" font-size="14">📊</text>
        <text x="36" y="29" font-size="10" font-weight="700" fill="#ffffff">CRM Sync</text>
      </g>

      <!-- Action 2: Slack Alert -->
      <g transform="translate(510, 175)">
        <rect width="90" height="50" rx="10" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>
        <text x="16" y="30" font-size="14">🔔</text>
        <text x="36" y="29" font-size="10" font-weight="700" fill="#00f2fe">Slack</text>
      </g>

      <!-- Action 3: Database -->
      <g transform="translate(510, 325)">
        <rect width="90" height="50" rx="10" fill="#0f172a" stroke="#ff7c4d" stroke-width="1.5"/>
        <text x="16" y="30" font-size="14">🗄️</text>
        <text x="36" y="29" font-size="10" font-weight="700" fill="#ff7c4d">Postgres</text>
      </g>
    </g>
  </g>

  <!-- 4. FLOATING 3D GLASS ACCENT BADGES (OVERLAY FOR DEPTH) -->
  <!-- Floating Badge 1 (Top Right) -->
  <g transform="translate(1020, 50)" filter="url(#heavy-shadow)">
    <rect width="180" height="46" rx="23" fill="#0b101d" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="24" cy="23" r="6" fill="#a855f7" filter="url(#neon-purple)"/>
    <text x="40" y="27" font-size="12" font-weight="800" fill="#ffffff">Autonomous 24/7</text>
  </g>

  <!-- Floating Badge 2 (Bottom Right) -->
  <g transform="translate(620, 580)" filter="url(#heavy-shadow)">
    <rect width="210" height="46" rx="12" fill="#0b101d" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="16" y="28" font-size="11" font-family="'Courier New', monospace" fill="#00f2fe">auto_agent.run()</text>
    <text x="145" y="28" font-size="10" font-weight="800" fill="#27c93f">✓ SUCCESS</text>
  </g>
</svg>
